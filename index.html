<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleCart</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>StyleCart</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="femme.html">Femme Fierce</a>
    <a href="gent.html">Gent Swagger</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <button onclick="showCart()">cart🛒</button>
  </nav>
</header>

<section class="hero">
  <h2>Look Good. <span>Feel Confident.</span></h2>
  <p>Affordable styles under KSh 2000</p>
</section>

<section class="products">

  <div class="card">
    <img src="Graphic Hoodie.jpg">
    <h3>Graphic Hoodie</h3>
    <p>KSh 1300</p>
    <button onclick="addToCart('Graphic Hoodie',1300)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="crops.jpg">
    <h3>Basic Crop Top</h3>
    <p>KSh 650</p>
    <button onclick="addToCart('Basic Crop Top',650)">Add to Cart</button>
  </div>

</section>

<section class="contact">
  <h2>Contact</h2>
  <p>📞 0712345678</p>
  <p> stylecart@gmail.com</p>
</section>

<!-- CART -->
<div class="cart" id="cart">
  <h2>Your Cart</h2>
  <div id="cart"></div>
  <p id="total"></p>
  <button onclick="showCheckout()">Checkout</button>
</div>

<!-- CHECKOUT -->
<div class="checkout" id="checkout">
  <h2>Checkout</h2>
  <form onsubmit="placeOrder(event)">
    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Phone Number" required>
    <input type="text" placeholder="Address" required>
    <button type="submit">Place Order</button>
  </form>
</div>

<script src="script.js"></script>

</body>
</html>
