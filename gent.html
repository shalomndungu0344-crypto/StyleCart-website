<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gent Swagger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header> 
        <h1>StyleCart</h1> 
        <nav> 
            <a href="index.html">Home</a> 
            <a href="femme.html">Femme Fierce</a> 
            <a href="gent.html">Gent Swagger</a> 
            <a href="about.html">About</a> 
            <a href="contact.html">Contact</a> 
        </nav> 
    </header>

    <h2 style="text-align:center;">Gent Swagger </h2> 
    <section class="products"> 
        <div class="card"> 
            <img src="hoodie.jpg"> 
            <h3>Hoodie</h3> 
            <p>KSh 1300</p> 
            <button onclick="addToCart('Hoodie',1300)">Add to Cart</button> 
        </div> 
        
        <div class="card"> 
            <img src="sneakers.jpg"> 
            <h3>Sneakers</h3> 
            <p>KSh 2000</p> 
            <button onclick="addToCart('Sneakers',2000)">Add to Cart</button> 
        </div> 
         <div class="card"> 
            <img src="Beanie.jpg"> 
            <h3>Beanie</h3> 
            <p>KSh 700</p> 
            <button onclick="addToCart('Beanie',700)">Add to Cart</button> 
        </div>  
        <div class="card"> 
            <img src="pants.jpg"> 
            <h3>Pants</h3> 
            <p>KSh 1700</p> 
            <button onclick="addToCart('Pants',1700)">Add to Cart</button> 
        </div> 
    </section>
    <!-- CART  -->
<div class="cart" id="cart">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <p id="total"></p>
  <button onclick="showCheckout()">Checkout</button>
</div>

<!-- CHECKOUT -->
<div class="checkout" id="checkout">
  <h2>Checkout</h2>
  <form onsubmit="placeOrder(event)">
    
    <label for="name">name</label>
    <input type="text" id="name" name="name" required>
    <label for="number">phone</label>
    <input type="number" id="phone" name="phone" required>
    <label for="email">email</label>
    <input type="text" id="email" name="email" required>
    <label for="address">address</label>
    <input type="text" id="address" name="address" required>

    <button type="submit">Place Order</button>
    <button onclick="resetOder()">reset oder</button>

  </form>
</div>
    <script src="script.js"></script>
</body>
</html>
