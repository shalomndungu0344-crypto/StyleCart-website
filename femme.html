<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemmeFierce</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Website header and navigation -->
    <header> 
        <h1>StyleCart</h1> 

        <nav> 
            <a href="index.html">Home</a> 
            <a href="femme.html">Femme Fierce</a> 
            <a href="gent.html">Gent Swagger</a> 
            <a href="about.html">About</a> 
            <a href="contact.html">Contact</a> 
        </nav> 
    </header>

    <!-- Page heading -->
    <h2 style="text-align:center;">Femme Fierce</h2> 

    <!-- Products section -->
    <section class="products"> 

        <!-- Product card -->
        <div class="card"> 
            <img src="pink dress.jpg" alt="Pink Dress"> 
            <h3>Pink Dress</h3> 
            <p>KSh 1200</p> 
            <button onclick="addToCart('Pink Dress',1200)">Add to Cart</button> 
        </div> 

        <div class="card"> 
            <img src="heels.jpg" alt="Heels"> 
            <h3>Heels</h3> 
            <p>KSh 1000</p> 
            <button onclick="addToCart('Heels',1000)">Add to Cart</button> 
        </div> 

        <div class="card">
            <img src="coach.jpg" alt="Coach Bag">
            <h3>Coach Bag</h3>
            <p>KSh 1800</p> 
            <button onclick="addToCart('Coach Bag',1800)">Add to Cart</button> 
        </div>

        <div class="card">
            <img src="crocks.jpg" alt="Crocs">
            <h3>Cute Crocs</h3>
            <p>KSh 800</p> 
            <button onclick="addToCart('Cute Crocs',800)">Add to Cart</button> 
        </div>

    </section>

    <!-- CART PANEL -->
    <div class="cart" id="cart">
        <h2>Your Cart</h2>

        <!-- Cart items will be injected here using JS -->
        <div id="cartItems"></div>

        <!-- Total price display -->
        <p id="total"></p>

        <!-- Open checkout panel -->
        <button onclick="showCheckout()">Checkout</button>
    </div>

    <!-- CHECKOUT PANEL -->
    <div class="checkout" id="checkout">
        <h2>Checkout</h2>

        <!-- Order form -->
        <form onsubmit="placeOrder(event)">

            <label>Name</label>
            <input type="text" id="name" required>

            <label>Phone</label>
            <input type="number" id="phone" required>

            <label>Email</label>
            <input type="text" id="email" required>

            <label>Address</label>
            <input type="text" id="address" required>

            <!-- Submit order -->
            <button type="submit">Place Order</button>

            <!-- Reset cart safely (no form submit trigger) -->
            <button type="button" onclick="resetOrder()">Reset Order</button>

        </form>
    </div>

    <!-- Footer section -->
    <footer>
        <div class="footer-content">
            <h3>StyleCart</h3>
            <p>Your one-stop destination for trendy and affordable fashion.</p>
            <p class="copyright">
                © 2026 StyleCart. All rights reserved.
            </p>
        </div>
    </footer>

    <!-- JavaScript file (placed correctly at end of body) -->
    <script src="script.js"></script>

</body>
</html>
