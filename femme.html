<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemmeFierce</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header> 
        <h1>StyleCart</h1> 
        <nav> 
            <a href="index.html">Home</a> 
            <a href="femme.html">Femme Fierce</a> 
            <a href="gent.html">Gent Swagger</a> 
            <a href="about.html">About</a> 
            <a href="contact.html">Contact</a> 
        </nav> 
    </header>

    <h2 style="text-align:center;">Femme Fierce </h2> 
    
    <section class="products"> 
        <div class="card"> 
            <img src="pink dress.jpg"> 
            <h3>Pink Dress</h3> 
            <p>KSh 1200</p> 
            <button onclick="addToCart('Pink Dress',1200)">Add to Cart</button> 
        </div> 
        
        <div class="card"> 
            <img src="heels.jpg"> 
            <h3>Heels</h3> 
            <p>KSh 1000</p> 
            <button onclick="addToCart('Heels',1000)">Add to Cart</button> 
        </div> 

        <div class="card">
            <img src="coach.jpg">
            <h3>coach bag</h3>
            <p>KSh 1800</p> 
            <button onclick="addToCart('coach bag',1800)">Add to Cart</button> 
        </div>
         <div class="card">
            <img src="crocks.jpg">
            <h3>cute crocks</h3>
            <p>KSh 800</p> 
            <button onclick="addToCart('cute crocks',800)">Add to Cart</button> 
         </div>
    </section>
    <!-- CART  -->
<div class="cart" id="cart">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <p id="total"></p>
  <button onclick="showCheckout()">Checkout</button>
</div>

<!-- CHECKOUT -->
<div class="checkout" id="checkout">
  <h2>Checkout</h2>
  <form onsubmit="placeOrder(event)">
    
    <label for="name">name</label>
    <input type="text" id="name" name="name" required>
    <label for="number">phone</label>
    <input type="number" id="phone" name="phone" required>
    <label for="email">email</label>
    <input type="text" id="email" name="email" required>
    <label for="address">address</label>
    <input type="text" id="address" name="address" required>

    <button type="submit">Place Order</button>
    <button onclick="resetOder()">reset oder</button>

  </form>
</div>
     <script src="script.js"></script>
</body>
</html>
